[project]
name = "doctrack"
version = "0.1.0"
description = "Real-time document corner detection and tracking from a desk camera."
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=1.24",
    # GUI build (NOT headless): the app uses cv2.imshow
    "opencv-python>=4.8",
    "pillow>=9",
    # voice notes (v) + PDF export (p): reuses ../speech/stt.py
    "faster-whisper>=1.0",
    "sounddevice>=0.4.6",
    "scipy>=1.10",
    "pypdf>=4",
    "paddleocr>=3.5",
]

[dependency-groups]
dev = ["pytest>=7"]

[tool.uv]
package = false
# uv's own Python builds always include Tk (the UI needs it); Homebrew's python@3.x does not.
python-preference = "only-managed"
# Newer mediapipe / onnxruntime ship no Intel-mac wheels: make uv also resolve versions
# that install on macOS x86_64 (it may pick different versions per platform).
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]
# sentencepiece (a mediapipe dependency) >= 0.2.1 has no Intel-mac wheel and needs cmake to build.
constraint-dependencies = ["sentencepiece<0.2.1 ; sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
