[project]
name = "doctrack"
version = "0.1.0"
description = "Real-time document corner detection and tracking from a desk camera."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    # GUI build (NOT headless): the app uses cv2.imshow
    "opencv-python>=4.8",
]

[dependency-groups]
dev = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
