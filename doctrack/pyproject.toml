[project]
name = "doctrack"
version = "0.1.0"
description = "Real-time document corner detection and tracking from a desk camera."
requires-python = ">=3.9"
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=1.24",
    # GUI build (NOT headless): the app uses cv2.imshow
    "onnxruntime>=1.17",
    "opencv-python>=4.8",
    "pillow>=9",
    "pyobjc-framework-vision>=10 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
